<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SONG LIST | 真咲 MASAKI OFFICIAL</title>
<meta name="description" content="真咲（VTuber・歌い手）の公式サイト。配信予定・歌える曲リスト・おみくじ・スタンプカード。">
<meta name="theme-color" content="#14101f">
<meta property="og:title" content="真咲 | MASAKI OFFICIAL"><meta property="og:image" content="https://masaki-room.github.io/img/ogp.jpg"><meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Cormorant+Garamond:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/favicon.png?v=2"><link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
<header class="ph" data-wm="SONG LIST"><p class="no">03</p><h1>SONG LIST</h1><small>歌える曲リスト</small><div class="bar"></div></header>
<main class="pg reveal">
  <div class="sl-top">
    <div class="sl-count"><b id="slN">–</b><span>SONGS</span><b id="slA">–</b><span>ARTISTS</span></div>
    <p class="sl-upd" id="slU"></p>
  </div>
  <div class="sl-tools">
    <input id="slQ" type="search" placeholder="曲名・アーティストで探す" autocomplete="off">
    <button type="button" class="sl-rand" id="slR">RANDOM</button>
  </div>
  <div class="sl-chips" id="slC"></div>
  <ul class="sl-list" id="slL"></ul>
  <p class="sl-note">楽曲データ協力：真君　／　<a class="songsLink" href="#" target="_blank" rel="noopener">UTAEMO</a> のデータを使用。エモカラの曲一覧をもとに、実際に歌える曲は変動する場合があります。</p>
  <div class="ticket">
    <div class="stub"><b>REQUEST</b><span>ADMIT ONE</span></div>
    <form id="reqForm">
      <div class="row"><input id="rName" placeholder="お名前（ニックネーム）" maxlength="20" required><select id="rSong" required></select></div>
      <textarea id="rMsg" placeholder="ひとこと（任意）" maxlength="100"></textarea>
      <button class="cta" type="submit">リクエストを送る</button>
      <ul class="sent" id="sent"></ul>
    </form>
  </div>
</main>
<script src="songs-data.js"></script>
<script src="app.js?v=8"></script>
</body></html>
