<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HP更新ページ | 真咲</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=2"><link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#a77ee8;--l:#d9c8f5;--bg:#0d0a16;--line:rgba(217,200,245,.22)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#1e1535,#07050d 70%) fixed;color:var(--l);font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.7;min-height:100vh;padding:20px 16px 80px;line-break:strict}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:Oswald,sans-serif;letter-spacing:.2em;font-size:22px;color:#fff;margin:6px 0 2px}
.sub{font-size:12px;letter-spacing:.15em;color:var(--p);margin-bottom:22px}
.card{border:1px solid var(--line);background:rgba(13,10,22,.7);padding:18px;margin-bottom:16px}
label{display:block;font-size:12px;letter-spacing:.1em;color:var(--p);margin:12px 0 4px}
input,select,textarea{width:100%;background:rgba(13,10,22,.8);border:1px solid var(--line);color:#fff;padding:12px;font:inherit;font-size:16px;border-radius:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;border:0;background:linear-gradient(100deg,#7a4fe0,var(--p));color:#fff;padding:13px 22px;font-weight:700;letter-spacing:.12em;margin-top:14px}
.btn.s{padding:8px 14px;font-size:13px;margin:0}
.ghost{background:none;border:1px solid var(--line);color:var(--l)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--line);background:rgba(167,126,232,.1);color:#fff;padding:22px 10px;text-align:center;font-size:15px;font-weight:700}
.tile small{display:block;font-family:Oswald,sans-serif;letter-spacing:.2em;color:var(--p);font-size:11px;margin-bottom:6px}
.back{background:none;border:0;color:var(--p);padding:6px 0;margin-bottom:10px;font-size:14px}
.item{border:1px solid var(--line);padding:12px;margin-bottom:10px;background:rgba(255,255,255,.03)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x{float:right;background:none;border:0;color:#ff9db1;font-size:13px}
.msg{font-size:13px;margin-top:10px;min-height:20px}
.ok{color:#9fe0b4}.ng{color:#ff9db1}
.req b{color:#fff}
.hint{font-size:12px;opacity:.7}
img.pv{max-width:100%;display:block;margin-top:8px;border:1px solid var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<h1>HP更新ページ</h1><div class="sub">MASAKI OFFICIAL SITE</div>

<section id="login" class="card">
  <label>合言葉</label>
  <input id="pw" type="password" autocomplete="current-password" placeholder="合言葉を入力">
  <button class="btn" id="loginBtn" type="button">入る</button>
  <div class="msg" id="loginMsg"></div>
</section>

<section id="home" hidden>
  <div class="tiles">
    <button class="tile" data-go="news"><small>NEWS</small>お知らせ</button>
    <button class="tile" data-go="sched"><small>SCHEDULE</small>配信予定</button>
    <button class="tile" data-go="prof"><small>PROFILE</small>プロフィール</button>
    <button class="tile" data-go="req"><small>REQUEST</small>リクエスト</button>
  </div>
  <p class="hint" style="margin-top:18px">保存すると、HPに反映されます（数秒〜1分ほど）。</p>
  <button class="btn ghost s" id="logout" type="button" style="margin-top:10px">ログアウト</button>
</section>

<section id="news" hidden>
  <button class="back" data-go="home">← もどる</button>
  <div class="card"><b>お知らせ</b>
    <div id="newsList"></div>
    <button class="btn ghost s" id="newsAdd" type="button" style="margin-top:6px">＋ 追加する</button>
    <br><button class="btn" id="newsSave" type="button">保存する</button><div class="msg" id="newsMsg"></div>
  </div>
</section>

<section id="sched" hidden>
  <button class="back" data-go="home">← もどる</button>
  <div class="card"><b>配信予定</b>
    <div id="schedList"></div>
    <button class="btn ghost s" id="schedAdd" type="button" style="margin-top:6px">＋ 追加する</button>
    <label>ひとこと（予定表の下に出る注意書き）</label>
    <input id="schedNote" placeholder="※予定は変更になることがあります。最新情報はXでお知らせします。">
    <button class="btn" id="schedSave" type="button">保存する</button><div class="msg" id="schedMsg"></div>
  </div>
</section>

<section id="prof" hidden>
  <button class="back" data-go="home">← もどる</button>
  <div class="card"><b>プロフィール</b>
    <div id="profList"></div>
    <button class="btn ghost s" id="profAdd" type="button" style="margin-top:6px">＋ 項目を追加</button>
    <label>プロフィールカードの画像</label>
    <input id="photo" type="file" accept="image/*">
    <img id="photoPv" class="pv" alt="" hidden>
    <p class="hint">画像は自動で小さく整えます。変えないときは選ばなくてOKです。</p>
    <button class="btn" id="profSave" type="button">保存する</button><div class="msg" id="profMsg"></div>
  </div>
</section>

<section id="req" hidden>
  <button class="back" data-go="home">← もどる</button>
  <div class="card"><b>届いたリクエスト</b>
    <div id="reqList" style="margin-top:10px"></div>
    <button class="btn ghost s" id="reqReload" type="button">更新する</button>
  </div>
</section>
</div>

<script>
(function(){
var SB="https://uglxilcwbgqoofnzngux.supabase.co/rest/v1/rpc/",KEY="sb_publishable_R83zSq90hslRd5jl04sIPg_hZlLxfRC";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function call(fn,a){return fetch(SB+fn,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(a||{})}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var PW="";try{PW=sessionStorage.getItem("mk_pw")||""}catch(e){}
var D={news:[],schedule:[],schedule_note:"",profile:[],photo:""};
var DEF_PROFILE=[["名前・読み方","真咲（まさき）"],["誕生日","9/12"],["性格","クール、低音女子"],["趣味・特技","歌（カラオケ）、ダンス、イラスト"],["活動内容","歌枠（メイン）、ゲーム配信"],["イメージカラー","紫"],["ファンネーム","まさリス"],["好きなもの","寿司、唐揚げ、チャーハン"],["推し歌い手","いれいす 様"],["一言メッセージ","真咲として新たにスタートした私を、応援しにきてくれると助かります！"]];
var DEF_NEWS=[["2026.11.25","INFO","公式サイトを公開しました。"],["2026.11.25","INFO","歌える曲リストとリクエスト機能を追加しました。"]];
function show(id){["login","home","news","sched","prof","req"].forEach(function(s){$("#"+s).hidden=s!==id});window.scrollTo(0,0)}
function msg(id,t,ok){var e=$(id);e.textContent=t;e.className="msg "+(ok?"ok":"ng")}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

document.addEventListener("click",function(e){var b=e.target.closest("[data-go]");if(b){var g=b.dataset.go;show(g);if(g==="req")loadReq()}});

function login(p){return call("masaki_chk",{p:p}).then(function(ok){if(!ok)throw new Error("ng");PW=p;try{sessionStorage.setItem("mk_pw",p)}catch(e){}return call("masaki_public")}).then(function(j){
  D.news=Array.isArray(j.news)?j.news:DEF_NEWS;D.schedule=Array.isArray(j.schedule)?j.schedule:[];D.schedule_note=j.schedule_note||"";D.profile=(Array.isArray(j.profile)&&j.profile.length)?j.profile:DEF_PROFILE;D.photo=j.photo||"";
  drawNews();drawSched();drawProf();show("home")})}
$("#loginBtn").onclick=function(){var p=$("#pw").value;if(!p)return;msg("#loginMsg","確認中…",true);login(p).catch(function(){msg("#loginMsg","合言葉が違うか、つながりませんでした。",false)})};
$("#pw").addEventListener("keydown",function(e){if(e.key==="Enter")$("#loginBtn").click()});
$("#logout").onclick=function(){PW="";try{sessionStorage.removeItem("mk_pw")}catch(e){}$("#pw").value="";show("login")};
if(PW)login(PW).catch(function(){show("login")});

/* news */
function drawNews(){$("#newsList").innerHTML=D.news.map(function(n,i){return '<div class="item"><button class="x" data-del="'+i+'" type="button">削除</button><label>日付</label><input data-f="0" data-i="'+i+'" value="'+esc(n[0])+'" placeholder="2026.11.28"><label>種類</label><select data-f="1" data-i="'+i+'">'+["INFO","LIVE","EVENT"].map(function(t){return '<option'+(n[1]===t?' selected':'')+'>'+t+'</option>'}).join("")+'</select><label>内容</label><textarea data-f="2" data-i="'+i+'">'+esc(n[2])+'</textarea></div>'}).join("")}
$("#newsList").addEventListener("input",function(e){var t=e.target;if(t.dataset.i!=null)D.news[+t.dataset.i][+t.dataset.f]=t.value});
$("#newsList").addEventListener("click",function(e){var b=e.target.closest("[data-del]");if(!b)return;D.news.splice(+b.dataset.del,1);drawNews()});
$("#newsAdd").onclick=function(){D.news.unshift([today().replace(/-/g,"."),"INFO",""]);drawNews()};
function save(k,v,m){return call("masaki_save",{p:PW,k:k,v:v}).then(function(){msg(m,"保存しました。HPに反映されます。",true)}).catch(function(){msg(m,"保存できませんでした。もう一度ためしてください。",false)})}
$("#newsSave").onclick=function(){var v=D.news.filter(function(n){return String(n[2]).trim()});save("news",v,"#newsMsg")};

/* schedule */
function drawSched(){D.schedule.sort(function(a,b){return (a.d+a.t).localeCompare(b.d+b.t)});$("#schedNote").value=D.schedule_note;
 $("#schedList").innerHTML=D.schedule.map(function(s,i){return '<div class="item"><button class="x" data-del="'+i+'" type="button">削除</button><label>日付</label><input type="date" data-f="d" data-i="'+i+'" value="'+esc(s.d)+'"><div class="row2"><div><label>時間</label><input data-f="t" data-i="'+i+'" value="'+esc(s.t)+'" placeholder="22:00〜"></div><div><label>場所</label><select data-f="p" data-i="'+i+'">'+["Mirrativ","YouTube","X","その他"].map(function(t){return '<option'+(s.p===t?' selected':'')+'>'+t+'</option>'}).join("")+'</select></div></div><label>タイトル</label><input data-f="ti" data-i="'+i+'" value="'+esc(s.ti)+'" placeholder="歌枠"></div>'}).join("")||'<p class="hint">まだ予定がありません。「＋ 追加する」から入れてください。</p>'}
$("#schedList").addEventListener("input",function(e){var t=e.target;if(t.dataset.i!=null)D.schedule[+t.dataset.i][t.dataset.f]=t.value});
$("#schedList").addEventListener("click",function(e){var b=e.target.closest("[data-del]");if(!b)return;D.schedule.splice(+b.dataset.del,1);drawSched()});
$("#schedAdd").onclick=function(){D.schedule.push({d:today(),t:"22:00〜",ti:"歌枠",p:"Mirrativ"});drawSched()};
$("#schedSave").onclick=function(){var v=D.schedule.filter(function(s){return s.d&&String(s.ti).trim()});
 save("schedule",v,"#schedMsg").then(function(){return call("masaki_save",{p:PW,k:"schedule_note",v:$("#schedNote").value})}).catch(function(){})};

/* profile */
function drawProf(){$("#profList").innerHTML=D.profile.map(function(r,i){return '<div class="item"><button class="x" data-del="'+i+'" type="button">削除</button><label>項目名</label><input data-f="0" data-i="'+i+'" value="'+esc(r[0])+'"><label>内容</label><textarea data-f="1" data-i="'+i+'">'+esc(r[1])+'</textarea></div>'}).join("");
 if(D.photo){$("#photoPv").src=D.photo;$("#photoPv").hidden=false}}
$("#profList").addEventListener("input",function(e){var t=e.target;if(t.dataset.i!=null)D.profile[+t.dataset.i][+t.dataset.f]=t.value});
$("#profList").addEventListener("click",function(e){var b=e.target.closest("[data-del]");if(!b)return;D.profile.splice(+b.dataset.del,1);drawProf()});
$("#profAdd").onclick=function(){D.profile.push(["",""]);drawProf()};
$("#photo").onchange=function(){var f=this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);D.photo=c.toDataURL("image/jpeg",.82);$("#photoPv").src=D.photo;$("#photoPv").hidden=false};im.src=fr.result};fr.readAsDataURL(f)};
$("#profSave").onclick=function(){var v=D.profile.filter(function(r){return String(r[0]).trim()&&String(r[1]).trim()});
 save("profile",v,"#profMsg").then(function(){if(D.photo&&D.photo.indexOf("data:image/")===0)return call("masaki_save",{p:PW,k:"photo",v:D.photo})}).catch(function(){})};

/* requests */
function loadReq(){$("#reqList").innerHTML='<p class="hint">読み込み中…</p>';call("masaki_req_list",{p:PW}).then(function(l){
 $("#reqList").innerHTML=l.length?l.map(function(r){var d=new Date(r.at);return '<div class="item req"><button class="x" data-rd="'+r.id+'" type="button">削除</button><b>'+esc(r.song)+'</b><br>'+esc(r.name)+(r.msg?'<br><span class="hint">'+esc(r.msg)+'</span>':'')+'<br><span class="hint">'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,"0")+':'+String(d.getMinutes()).padStart(2,"0")+'</span></div>'}).join(""):'<p class="hint">まだリクエストはありません。</p>'}).catch(function(){$("#reqList").innerHTML='<p class="ng">読み込めませんでした。</p>'})}
$("#reqList").addEventListener("click",function(e){var b=e.target.closest("[data-rd]");if(!b)return;if(!confirm("このリクエストを削除しますか？"))return;call("masaki_req_del",{p:PW,i:+b.dataset.rd}).then(loadReq)});
$("#reqReload").onclick=loadReq;
})();
</script>
</body>
</html>
